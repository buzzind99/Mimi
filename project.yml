name: Mimi
options:
  bundleIdPrefix: dev.mimi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Mimi Dev"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"

targets:
  Mimi:
    type: application
    platform: macOS
    sources:
      - path: Mimi
    settings:
      base:
        PRODUCT_NAME: Mimi
        PRODUCT_BUNDLE_IDENTIFIER: dev.mimi.app.lite
        SWIFT_OBJC_BRIDGING_HEADER: Mimi/Bridging/MimiBridging.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Mimi/native/include"
        LD_RUNPATH_SEARCH_PATHS: "$(SRCROOT)/local/frameworks @executable_path/../Frameworks"
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "Mimi captures your Mac's system audio (via ScreenCaptureKit) so it can transcribe and translate it locally on this Mac. Mimi never records or stores your screen. Audio never leaves your machine."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        BUNDLED_MODEL: 0
    scheme:
      testTargets: []

  Mimi-full:
    type: application
    platform: macOS
    sources:
      - path: Mimi
      - path: models
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_NAME: Mimi
        PRODUCT_BUNDLE_IDENTIFIER: dev.mimi.app.full
        SWIFT_OBJC_BRIDGING_HEADER: Mimi/Bridging/MimiBridging.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Mimi/native/include"
        LD_RUNPATH_SEARCH_PATHS: "$(SRCROOT)/local/frameworks @executable_path/../Frameworks"
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "Mimi captures your Mac's system audio (via ScreenCaptureKit) so it can transcribe and translate it locally on this Mac. Mimi never records or stores your screen. Audio never leaves your machine."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        BUNDLED_MODEL: 1
    scheme: {}
