name: Mimi
options:
  bundleIdPrefix: dev.mimi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Mimi Dev"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"

targets:
  Mimi:
    type: application
    platform: macOS
    sources:
      - path: Mimi
    settings:
      base:
        PRODUCT_NAME: Mimi
        PRODUCT_BUNDLE_IDENTIFIER: dev.mimi.app
        LD_RUNPATH_SEARCH_PATHS: "$(SRCROOT)/local/frameworks @executable_path/../Frameworks $(SRCROOT)/local/frameworks/crispasr @executable_path/../Frameworks/crispasr"
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "Mimi captures your Mac's system audio (via ScreenCaptureKit) so it can transcribe and translate it locally on this Mac. Mimi never records or stores your screen. Audio never leaves your machine."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    scheme:
      testTargets:
        - MimiTests
  MimiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MimiTests
    dependencies:
      - target: Mimi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mimi.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mimi.app/Contents/MacOS/Mimi"
        BUNDLE_LOADER: "$(TEST_HOST)"
