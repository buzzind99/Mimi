name: Mimi
options:
  bundleIdPrefix: dev.mimi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    ARCHS: arm64

# Signing identity comes from local/signing.xcconfig (gitignored), written by
# scripts/bootstrap.sh: "Mimi Dev" when that certificate exists, ad-hoc (-)
# otherwise. project.yml deliberately does not set CODE_SIGN_IDENTITY —
# explicit build settings would override the xcconfig.
configFiles:
  Debug: local/signing.xcconfig
  Release: local/signing.xcconfig

targets:
  Mimi:
    type: application
    platform: macOS
    sources:
      - path: Mimi
    settings:
      base:
        PRODUCT_NAME: Mimi
        PRODUCT_BUNDLE_IDENTIFIER: dev.mimi.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(SRCROOT)/local/frameworks @executable_path/../Frameworks $(SRCROOT)/local/frameworks/crispasr @executable_path/../Frameworks/crispasr"
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "Mimi captures your Mac's system audio (via ScreenCaptureKit) so it can transcribe and translate it locally on this Mac. Mimi never records or stores your screen. Audio never leaves your machine."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    scheme:
      gatherCoverageData: true
      testTargets:
        - MimiTests
  MimiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MimiTests
    dependencies:
      - target: Mimi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mimi.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mimi.app/Contents/MacOS/Mimi"
        BUNDLE_LOADER: "$(TEST_HOST)"
